<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ascii-blobs</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07080b;
        color: #c4cbd6;
        font-family: 'JetBrains Mono', monospace;
      }
      #readout {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 10;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: rgba(196, 203, 214, 0.55);
      }
    </style>
  </head>
  <body>
    <div id="readout">booting</div>
    <script type="module">
      import { AsciiBlobs } from '/src/vanilla.ts';

      // Wait for the mono face so the measured ramp matches what ships.
      await (document.fonts?.ready ?? Promise.resolve());

      const renderer = new URLSearchParams(location.search).get('renderer') ?? 'auto';
      const instance = new AsciiBlobs(document.body, { renderer });
      const readout = document.getElementById('readout');
      setInterval(() => {
        const stats = instance.getStats();
        readout.textContent = `${stats.renderer ?? 'none'} · ${stats.fps} fps · ${stats.blobCount} blobs`;
      }, 500);
    </script>
  </body>
</html>
